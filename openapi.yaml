openapi: 3.0.3
info:
  title: Tire API - Prototipo 1
  description: >
    Backend del sistema Tire: prevención de accidentes viales por microsueños en
    conductores de transporte de carga y particulares. Conecta la App Móvil
    (rol CONDUCTOR) y el Panel Web (rol DESPACHADOR) bajo Arquitectura Hexagonal.
    Autenticación mediante JWT de vida corta; errores en formato RFC 9457
    (application/problem+json).
  version: 1.0.0
  contact:
    name: Equipo Tire - Universidad Nacional de Colombia
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Entorno local
  - url: https://tire-backend.onrender.com
    description: Producción (reverse proxy TLS)

tags:
  - name: Autenticación
    description: Registro, inicio de sesión y cambio de contraseña.
  - name: Conductores
    description: CRUD de conductores (exclusivo rol DESPACHADOR).
  - name: Viajes
    description: Ciclo de vida de viajes, telemetría y eventos de fatiga.
  - name: Flota y Alertas
    description: Panorama de flota e incidentes (exclusivo rol DESPACHADOR).

security:
  - bearerAuth: []

paths:
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar un nuevo usuario
      description: Ruta pública. Crea un usuario (CONDUCTOR o DESPACHADOR).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nombre: "María Despachadora"
              email: "despachador@tire.com"
              password: "Password123"
              rol: "DESPACHADOR"
              flotaId: "11111111-1111-1111-1111-111111111111"
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/sesion:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Ruta pública. Devuelve un access token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "despachador@tire.com"
              password: "Password123"
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/contrasena:
    put:
      tags: [Autenticación]
      summary: Cambiar contraseña del usuario autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPasswordRequest'
            example:
              passwordActual: "Password123"
              passwordNueva: "NuevaPassword456"
      responses:
        '200':
          description: Contraseña actualizada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/recuperacion:
    post:
      tags: [Autenticación]
      summary: Solicitar recuperación de contraseña (HU-04)
      description: Ruta pública. Procesa y simula el envío de instrucciones de restablecimiento.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacionPasswordRequest'
            example:
              email: "conductor@tire.com"
      responses:
        '200':
          description: Solicitud de recuperación procesada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
              example:
                mensaje: "Si el correo está registrado, se enviaron las instrucciones de recuperación."
        '400':
          $ref: '#/components/responses/BadRequest'

  /conductores:
    post:
      tags: [Conductores]
      summary: Crear conductor (DESPACHADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorRequest'
            example:
              nombre: "Pedro Conductor"
              documento: "CC-1024"
              correo: "pedro@tire.com"
              telefono: "3001234567"
              flotaId: "11111111-1111-1111-1111-111111111111"
      responses:
        '201':
          description: Conductor creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Conductores]
      summary: Listar conductores (DESPACHADOR)
      responses:
        '200':
          description: Lista de conductores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /conductores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Conductores]
      summary: Obtener conductor por ID (DESPACHADOR)
      responses:
        '200':
          description: Conductor encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Conductores]
      summary: Actualizar conductor (DESPACHADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarConductorRequest'
            example:
              nombre: "Pedro Pérez"
              telefono: "3009998888"
              activo: true
      responses:
        '200':
          description: Conductor actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Conductores]
      summary: Desactivar conductor (DESPACHADOR, borrado lógico)
      responses:
        '200':
          description: Conductor desactivado (activo=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /viajes:
    post:
      tags: [Viajes]
      summary: Iniciar viaje (CONDUCTOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViajeRequest'
            example:
              origen: "Bogotá"
              destino: "Medellín"
              latitudInicial: 4.711
              longitudInicial: -74.0721
      responses:
        '201':
          description: Viaje iniciado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Viajes]
      summary: Listar viajes (CONDUCTOR o DESPACHADOR)
      responses:
        '200':
          description: Lista de viajes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /viajes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Viajes]
      summary: Obtener viaje por ID (CONDUCTOR o DESPACHADOR)
      responses:
        '200':
          description: Viaje encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Viajes]
      summary: Cancelar viaje (CONDUCTOR o DESPACHADOR)
      description: Solo permite cancelar viajes en curso y sin eventos de fatiga.
      responses:
        '204':
          description: Viaje cancelado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /viajes/{id}/finalizar:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Viajes]
      summary: Finalizar viaje (CONDUCTOR)
      responses:
        '200':
          description: Viaje finalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /viajes/{id}/telemetria:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Viajes]
      summary: Registrar telemetría (CONDUCTOR)
      description: Enriquece el viaje con el clima actual consultado a Open-Meteo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetriaRequest'
            example:
              latitud: 5.5353
              longitud: -73.3678
      responses:
        '200':
          description: Telemetría registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /viajes/{id}/eventos:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Viajes]
      summary: Registrar evento de fatiga (CONDUCTOR)
      description: >
        Registra un microsueño. Si el nivel de alerta escala a CRITICO se abre
        automáticamente una alerta para el despachador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoFatigaRequest'
            example:
              latitud: 5.5353
              longitud: -73.3678
              duracionOjosCerradosSegundos: 2.0
              confirmadoPorConductor: false
      responses:
        '201':
          description: Evento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /viajes/{id}/confirmar-alerta:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Viajes]
      summary: Confirmar alerta por el conductor (CONDUCTOR)
      responses:
        '200':
          description: Alerta confirmada; nivel recalculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /flota/estado:
    get:
      tags: [Flota y Alertas]
      summary: Estado de la flota (DESPACHADOR)
      responses:
        '200':
          description: Resumen de viajes activos por nivel de alerta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoFlotaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /alertas:
    get:
      tags: [Flota y Alertas]
      summary: Listar alertas abiertas (DESPACHADOR)
      responses:
        '200':
          description: Alertas críticas sin atender.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /alertas/{id}/atender:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Flota y Alertas]
      summary: Atender una alerta crítica (DESPACHADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtenderAlertaRequest'
            example:
              notas: "Contacté al conductor; se detendrá en el próximo paradero."
      responses:
        '200':
          description: Alerta atendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /incidentes:
    get:
      tags: [Flota y Alertas]
      summary: Listar incidentes atendidos (DESPACHADOR)
      parameters:
        - name: fechaInicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fecha y hora inicial del filtro (ISO-8601).
          example: "2026-11-01T00:00:00"
        - name: fechaFin
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Fecha y hora final del filtro (ISO-8601).
          example: "2026-11-30T23:59:59"
      responses:
        '200':
          description: Alertas críticas ya atendidas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por POST /auth/sesion.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://tire.unal.com/problems/validation-error"
            title: "Error de validacion"
            status: 400
            detail: "Uno o mas campos de la solicitud no son validos."
            instance: "/conductores"
            errors:
              - field: "correo"
                message: "El correo es obligatorio"
    Unauthorized:
      description: No autenticado (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://tire.unal.com/problems/unauthorized"
            title: "No autenticado"
            status: 401
            detail: "Se requiere un token de acceso valido para acceder a este recurso."
            instance: "/conductores"
    Forbidden:
      description: Acceso denegado por rol (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://tire.unal.com/problems/forbidden"
            title: "Acceso denegado"
            status: 403
            detail: "No tiene permisos para acceder a este recurso."
            instance: "/conductores"
    NotFound:
      description: Recurso no encontrado (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://tire.unal.com/problems/not-found"
            title: "Recurso no encontrado"
            status: 404
            detail: "Conductor no encontrado"
            instance: "/conductores/00000000-0000-0000-0000-000000000000"
    Conflict:
      description: Conflicto de estado (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://tire.unal.com/problems/conflict"
            title: "Conflicto de estado"
            status: 409
            detail: "El conductor ya tiene un viaje activo en curso"
            instance: "/viajes"

  schemas:
    RolUsuario:
      type: string
      enum: [CONDUCTOR, DESPACHADOR]

    EstadoViaje:
      type: string
      enum: [EN_CURSO, FINALIZADO, CANCELADO]

    NivelAlerta:
      type: string
      enum: [NORMAL, PRECAUCION, CRITICO]

    CondicionClimatica:
      type: object
      properties:
        temperaturaCelsius:
          type: number
          format: double
          example: 18.4
        velocidadVientoKmh:
          type: number
          format: double
          example: 12.0
        descripcion:
          type: string
          example: "LLUVIA"

    RegistroRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          example: "María Despachadora"
        email:
          type: string
          format: email
          example: "despachador@tire.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "Password123"
        rol:
          $ref: '#/components/schemas/RolUsuario'
        flotaId:
          type: string
          format: uuid
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "despachador@tire.com"
        password:
          type: string
          format: password
          example: "Password123"

    CambioPasswordRequest:
      type: object
      required: [passwordActual, passwordNueva]
      properties:
        passwordActual:
          type: string
          format: password
          example: "Password123"
        passwordNueva:
          type: string
          format: password
          minLength: 8
          example: "NuevaPassword456"

    RecuperacionPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: "conductor@tire.com"

    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Si el correo está registrado, se enviaron las instrucciones de recuperación."

    AuthResponse:
      type: object
      description: Usuario recién registrado (sin hash de contraseña).
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/RolUsuario'
        flotaId:
          type: string
          format: uuid
          nullable: true
        activo:
          type: boolean

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiJ9..."
        tipo:
          type: string
          example: "Bearer"
        expiracionSegundos:
          type: integer
          format: int64
          example: 3600
        rol:
          $ref: '#/components/schemas/RolUsuario'
        usuarioId:
          type: string
          format: uuid
        nombre:
          type: string

    ConductorRequest:
      type: object
      required: [nombre, documento, correo]
      properties:
        nombre:
          type: string
          example: "Pedro Conductor"
        documento:
          type: string
          example: "CC-1024"
        correo:
          type: string
          format: email
          example: "pedro@tire.com"
        telefono:
          type: string
          nullable: true
          example: "3001234567"
        flotaId:
          type: string
          format: uuid
          nullable: true

    ActualizarConductorRequest:
      type: object
      properties:
        nombre:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        activo:
          type: boolean
          nullable: true

    ConductorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        documento:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
          nullable: true
        flotaId:
          type: string
          format: uuid
          nullable: true
        activo:
          type: boolean
        creadoEn:
          type: string
          format: date-time

    ViajeRequest:
      type: object
      required: [origen, destino]
      properties:
        origen:
          type: string
          example: "Bogotá"
        destino:
          type: string
          example: "Medellín"
        latitudInicial:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          example: 4.711
        longitudInicial:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          example: -74.0721

    TelemetriaRequest:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 5.5353
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -73.3678

    EventoFatigaRequest:
      type: object
      required: [duracionOjosCerradosSegundos]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          example: 5.5353
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          example: -73.3678
        duracionOjosCerradosSegundos:
          type: number
          format: double
          example: 2.0
        confirmadoPorConductor:
          type: boolean
          example: false

    EventoFatigaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        viajeId:
          type: string
          format: uuid
        fechaHora:
          type: string
          format: date-time
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        duracionOjosCerradosSegundos:
          type: number
          format: double
        confirmadoPorConductor:
          type: boolean
        climaEnRuta:
          $ref: '#/components/schemas/CondicionClimatica'

    ViajeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conductorId:
          type: string
          format: uuid
        origen:
          type: string
        destino:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoViaje'
        nivelAlerta:
          $ref: '#/components/schemas/NivelAlerta'
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
        ultimaLatitud:
          type: number
          format: double
          nullable: true
        ultimaLongitud:
          type: number
          format: double
          nullable: true
        ultimoClima:
          $ref: '#/components/schemas/CondicionClimatica'
        eventosFatiga:
          type: array
          items:
            $ref: '#/components/schemas/EventoFatigaResponse'

    AtenderAlertaRequest:
      type: object
      required: [notas]
      properties:
        notas:
          type: string
          maxLength: 1000
          example: "Contacté al conductor; se detendrá en el próximo paradero."

    AlertaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        viajeId:
          type: string
          format: uuid
        conductorId:
          type: string
          format: uuid
          nullable: true
        flotaId:
          type: string
          format: uuid
          nullable: true
        fechaApertura:
          type: string
          format: date-time
        fechaAtencion:
          type: string
          format: date-time
          nullable: true
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        atendida:
          type: boolean
        notasDespachador:
          type: string
          nullable: true

    EstadoFlotaResponse:
      type: object
      properties:
        totalViajesActivos:
          type: integer
          example: 3
        conteoPorNivel:
          type: object
          additionalProperties:
            type: integer
          example:
            NORMAL: 1
            PRECAUCION: 1
            CRITICO: 1
        viajesActivos:
          type: array
          items:
            $ref: '#/components/schemas/ViajeResponse'

    ProblemDetails:
      type: object
      description: Error en formato RFC 9457 (application/problem+json).
      properties:
        type:
          type: string
          format: uri
          example: "https://tire.unal.com/problems/conflict"
        title:
          type: string
          example: "Conflicto de estado"
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: "El conductor ya tiene un viaje activo en curso"
        instance:
          type: string
          format: uri
          example: "/viajes"
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
