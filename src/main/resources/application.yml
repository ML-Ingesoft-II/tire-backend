server:
  port: ${PORT:8080}

spring:
  application:
    name: tire-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tire_db}
    username: ${DATABASE_USERNAME:tire_user}
    password: ${DATABASE_PASSWORD:tire_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
