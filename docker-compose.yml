services:
  postgres:
    image: postgres:16-alpine
    container_name: tire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tire_db
      POSTGRES_USER: tire_user
      POSTGRES_PASSWORD: tire_password
    ports:
      - "5432:5432"
    volumes:
      - tire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tire_user -d tire_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tire_pgdata:
